
<!DOCTYPE html>

<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>网站维护中</title>

    <style>

        * { margin: 0; padding: 0; box-sizing: border-box; }



        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

            background: #f8f9fa;

            color: #333;

            padding: 20px;

        }



        .container {

            text-align: center;

            max-width: 480px;

        }



        .icon {

            font-size: 48px;

            margin-bottom: 20px;

            opacity: 0.8;

        }



        h1 {

            font-size: 24px;

            font-weight: 600;

            margin-bottom: 12px;

            color: #1a1a1a;

        }



        p {

            font-size: 15px;

            line-height: 1.6;

            color: #666;

            margin-bottom: 24px;

        }



        .contact {

            font-size: 14px;

            color: #999;

        }



        .contact a {

            color: #555;

            text-decoration: none;

            border-bottom: 1px solid #ccc;

            transition: border-color 0.2s;

        }



        .contact a:hover {

            border-color: #555;

        }

    </style>

</head>

<body>

    <div class="container">

        <div class="icon">🔧</div>

        <h1>网站维护中</h1>

        <p>我们正在优化更新系统，平台暂停服务。<br>感谢您对我们的支持。</p>

    </div>

</body>

</html>
